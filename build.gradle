plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'dev.mixinmcp.decompile' version '1.5.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fzzyhmstrs.me/' }
    maven { url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "maven.modrinth:b93awgkg:${project.status_version_id}"
    modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"
    testImplementation platform("org.junit:junit-bom:5.14.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def releaseVersion = project.version.toString()
def archiveName = project.archives_base_name.toString()

processResources {
    inputs.property 'version', releaseVersion
    filesMatching('fabric.mod.json') {
        expand 'version': releaseVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
    from('NOTICE.md') {
        rename { "${it}_${archiveName}" }
    }
}

test { useJUnitPlatform() }

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
