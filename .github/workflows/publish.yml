name: Publish
on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose where to publish
        required: true
        default: all
        type: choice
        options: [all, modrinth, curseforge, github]
      loader:
        description: Storefront loaders to upload (GitHub always includes both)
        required: true
        default: both
        type: choice
        options: [both, fabric, neoforge]
concurrency:
  group: roleplay-status-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate changelog and read release version
        id: meta
        shell: bash
        run: |
          version=$(python scripts/release_notes.py --version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test both releases
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --warning-mode all
          python scripts/verify_release.py
          python scripts/release_notes.py --output build/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: verified-standalone-releases
          path: |
            fabric/build/libs/roleplay-status-fabric-${{ steps.meta.outputs.version }}.jar
            neoforge/build/libs/roleplay-status-neoforge-${{ steps.meta.outputs.version }}.jar
            build/release-notes.md
          if-no-files-found: error
  publish:
    if: inputs.target == 'all' || inputs.target == 'modrinth'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - loader: fabric
            dependencies: |
              fabric-api(required){modrinth:P7dR8mSH}
              fabric-language-kotlin(required){modrinth:fabric-language-kotlin}
              fzzy_config(required){modrinth:fzzy-config}
          - loader: neoforge
            dependencies: |
              kotlinforforge(required){modrinth:kotlin-for-forge}
              fzzy_config(required){modrinth:fzzy-config}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-standalone-releases
          path: release
      - name: Check publishing credential
        if: ${{ inputs.loader == 'both' || inputs.loader == matrix.loader }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Configure MODRINTH_TOKEN with version upload access to project v5aMEMjW."
            exit 1
          fi
      - name: Publish loader release to Modrinth
        if: ${{ inputs.loader == 'both' || inputs.loader == matrix.loader }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: v5aMEMjW
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/${{ matrix.loader }}/build/libs/roleplay-status-${{ matrix.loader }}-${{ needs.build.outputs.version }}.jar
          name: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version-type: release
          changelog-file: release/build/release-notes.md
          game-versions: 1.21.1
          loaders: ${{ matrix.loader }}
          java: 21
          dependencies: ${{ matrix.dependencies }}

  curseforge:
    if: inputs.target == 'all' || inputs.target == 'curseforge'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - loader: fabric
            dependencies: |
              fabric-api(required){curseforge:fabric-api}
              fabric-language-kotlin(required){curseforge:fabric-language-kotlin}
              fzzy_config(required){curseforge:fzzy-config}
          - loader: neoforge
            dependencies: |
              kotlinforforge(required){curseforge:kotlin-for-forge}
              fzzy_config(required){curseforge:fzzy-config}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-standalone-releases
          path: release
      - name: Check publishing credential
        if: ${{ inputs.loader == 'both' || inputs.loader == matrix.loader }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Configure CURSEFORGE_TOKEN with version upload access to CurseForge project 1834639."
            exit 1
          fi
      - name: Publish loader release to CurseForge
        if: ${{ inputs.loader == 'both' || inputs.loader == matrix.loader }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: 1834639
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: release/${{ matrix.loader }}/build/libs/roleplay-status-${{ matrix.loader }}-${{ needs.build.outputs.version }}.jar
          name: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version: ${{ needs.build.outputs.version }}-${{ matrix.loader }}
          version-type: release
          changelog-file: release/build/release-notes.md
          game-versions: 1.21.1
          loaders: ${{ matrix.loader }}
          java: 21
          dependencies: ${{ matrix.dependencies }}

  github-release:
    if: inputs.target == 'all' || inputs.target == 'github'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-standalone-releases
          path: release
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Roleplay Status $VERSION" \
            --notes-file release/build/release-notes.md \
            "release/fabric/build/libs/roleplay-status-fabric-$VERSION.jar" \
            "release/neoforge/build/libs/roleplay-status-neoforge-$VERSION.jar"
