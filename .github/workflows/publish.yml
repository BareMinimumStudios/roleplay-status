name: Publish
on:
  workflow_dispatch:
    inputs:
      loader:
        description: Upload both loaders, or retry only one after a partial release
        required: true
        default: both
        type: choice
        options: [both, fabric, neoforge]
concurrency:
  group: roleplay-status-modrinth-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check publishing credential
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Configure MODRINTH_TOKEN with version upload access to project v5aMEMjW."
            exit 1
          fi
      - name: Read release version
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+1\.21\.1$ ]]; then
            echo "Invalid mod_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test both releases
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --warning-mode all
          python scripts/verify_release.py
          python scripts/release_notes.py > build/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: verified-standalone-releases
          path: |
            fabric/build/libs/roleplay-status-fabric-${{ steps.meta.outputs.version }}.jar
            neoforge/build/libs/roleplay-status-neoforge-${{ steps.meta.outputs.version }}.jar
            build/release-notes.md
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - loader: fabric
            label: Fabric
            dependencies: |
              fabric-api(required){modrinth:P7dR8mSH}
              fabric-language-kotlin(required){modrinth:fabric-language-kotlin}
              fzzy_config(required){modrinth:fzzy-config}
          - loader: neoforge
            label: NeoForge
            dependencies: |
              kotlinforforge(required){modrinth:kotlin-for-forge}
              fzzy_config(required){modrinth:fzzy-config}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-standalone-releases
          path: release
      - name: Publish loader release to Modrinth
        if: ${{ inputs.loader == 'both' || inputs.loader == matrix.loader }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: v5aMEMjW
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: release/${{ matrix.loader }}/build/libs/roleplay-status-${{ matrix.loader }}-${{ needs.build.outputs.version }}.jar
          name: Roleplay Status ${{ needs.build.outputs.version }} — ${{ matrix.label }}
          version: ${{ needs.build.outputs.version }}
          version-type: release
          changelog-file: release/build/release-notes.md
          game-versions: 1.21.1
          loaders: ${{ matrix.loader }}
          java: 21
          dependencies: ${{ matrix.dependencies }}
