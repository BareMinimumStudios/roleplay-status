name: Build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew :${{ matrix.loader }}:build --warning-mode all
      - name: Verify loader artifact
        env:
          RELEASE_LOADER: ${{ matrix.loader }}
        run: python scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: roleplay-status-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
